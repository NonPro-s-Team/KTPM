spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: ${JWT_SECRET}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  recaptcha-secret: ${RECAPTCHA_SECRET}

app:
  sepay:
    merchant-id: ${SEPAY_MERCHANT_ID:}
    secret-key: ${SEPAY_SECRET_KEY:}
    api-key: ${SEPAY_API_KEY:}
  mail:
    shop-email: ${SHOP_EMAIL:}
ghn:
  token: ${GHN_TOKEN:}
  shop-id: ${GHN_SHOP_ID:0}
  base-url: https://online-gateway.ghn.vn
  order-base-url: ${GHN_ORDER_BASE_URL:https://dev-online-gateway.ghn.vn}
  from-district-id: 1454
  from-ward-code: "21201"
  service-type-id: 2
  webhook-token: ${GHN_WEBHOOK_TOKEN:}

logging:
  level:
    root: INFO
    com.greenjuicehub: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

vnpay:
  return-url: http://localhost:5173/payment/vnpay/result
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8081/api/payment/vnpay/ipn}
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}

gemini:
  api-key: ${GEMINI_API_KEY:}
