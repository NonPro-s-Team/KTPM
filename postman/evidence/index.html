<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Test Evidence</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}.page{width:1400px;min-height:900px;margin:0 auto;background:#fff}.top{height:78px;background:#17233b;color:white;display:flex;align-items:center;padding:0 42px;gap:20px}.mark{width:42px;height:42px;border-radius:12px;background:#ff6c37;display:grid;place-items:center;font-weight:900;font-size:20px}.top h1{margin:0;font-size:22px}.top p{margin:3px 0 0;color:#b9c7dc}.stamp{margin-left:auto;text-align:right}.body{padding:28px 40px}.summary{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:14px;margin-bottom:22px}.card{border:1px solid #dce3ed;border-radius:12px;padding:15px;background:#fbfcfe}.card strong{display:block;font-size:22px;margin-top:4px}.green{color:#16803b}.red{color:#c63434}.blue{color:#1769aa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.case{border:1px solid #dce3ed;border-radius:12px;overflow:hidden;background:white}.case-head{padding:11px 14px;background:#f6f8fb;border-bottom:1px solid #dce3ed;display:flex;align-items:center;gap:10px;font-weight:650}.method{font-size:12px;font-weight:800;padding:4px 7px;border-radius:5px;color:white;background:#1769aa}.POST{background:#f0a128}.PATCH{background:#7b55c7}.status{margin-left:auto;border-radius:12px;padding:3px 9px;font-weight:800}.s2{background:#ddf5e5;color:#147333}.s4{background:#fde5e5;color:#a82b2b}.url{padding:9px 14px;font:12px Consolas,monospace;color:#3d4a60;border-bottom:1px solid #edf0f4}.cols{display:grid;grid-template-columns:1fr 1fr}.pane{padding:10px 13px;min-height:112px}.pane+ .pane{border-left:1px solid #edf0f4}.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#758199;margin-bottom:6px}pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.42 Consolas,monospace;color:#24324a}.foot{margin-top:17px;border-radius:10px;padding:11px 14px;background:#eff8f2;color:#23623a}.note{background:#fff7e8;color:#855a0a}.badge{display:inline-block;padding:2px 7px;border-radius:10px;background:#e8eef8;color:#415675;font-size:11px;margin-right:4px}
</style></head><body><div class="page"><header class="top"><div class="mark">API</div><div><h1 id="title"></h1><p>Green Juice Hub · Postman-compatible API evidence · Local test database</p></div><div class="stamp"><b>RUN VERIFIED</b><br><span>25/08/2026 · Asia/Saigon</span></div></header><main class="body"><section class="summary" id="summary"></section><section class="grid" id="grid"></section><div class="foot" id="foot"></div></main></div>
<script>

['PATCH','/api/orders/85/cancel',200,'Huỷ đơn PENDING','{"reason":"Evidence cancellation"}','{"id":85,"status":"CANCELLED","cancelledBy":"CUSTOMER"}'],

['POST','/api/orders/shipping-fee',403,'Thiếu Bearer token','{"addressId":1,"variantId":91,"quantity":1}','(empty body)'] ]}
};
const key=new URLSearchParams(location.search).get('task')||'order',d=data[key];title.textContent=d.title;summary.innerHTML=`<div class="card"><span>Phạm vi</span><strong>${d.title.split('·')[1]}</strong></div>`+d.stats.map((x,i)=>`<div class="card"><span>${['Tổng kiểm thử','Thành công','Negative / Security'][i]}</span><strong class="${i===1?'green':i===2?'red':'blue'}">${x}</strong></div>`).join('');grid.innerHTML=d.cases.map(c=>`<article class="case"><div class="case-head"><span class="method ${c[0]}">${c[0]}</span>${c[3]}<span class="status s${String(c[2])[0]}">HTTP ${c[2]}</span></div><div class="url">{{base_url}}${c[1]}</div><div class="cols"><div class="pane"><div class="label">Request</div><pre>${c[4]}</pre></div><div class="pane"><div class="label">Response thực tế</div><pre>${c[5]}</pre></div></div></article>`).join('');foot.textContent=d.foot;
