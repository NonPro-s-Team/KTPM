name: Build and deploy RMS API to Azure App Service

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  API_PROJECT: "backend/src/RMS.API/RMS.API.csproj"
  PUBLISH_DIRECTORY: "./publish"
  AZURE_WEBAPP_NAME: "rms-api-hientm-2026"

jobs:
  build:
    name: Build RMS API
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Lấy source code từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt .NET 10 SDK
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Hiển thị thông tin .NET để hỗ trợ debug
      - name: Display .NET information
        run: dotnet --info

      # 4. Restore dependency cho đúng project RMS.API
      - name: Restore RMS API
        run: dotnet restore "${{ env.API_PROJECT }}"

      # 5. Build RMS.API và các project được tham chiếu
      - name: Build RMS API
        run: >
          dotnet build
          "${{ env.API_PROJECT }}"
          --configuration Release
          --no-restore

      # 6. Publish ứng dụng vào thư mục ./publish
      - name: Publish RMS API
        run: >
          dotnet publish
          "${{ env.API_PROJECT }}"
          --configuration Release
          --output "${{ env.PUBLISH_DIRECTORY }}"
          --no-restore
          --no-build

      # 7. Xác nhận output publish thực sự có RMS.API.dll
      - name: Verify publish output
        shell: bash
        run: |
          echo "Published files:"
          ls -la "${{ env.PUBLISH_DIRECTORY }}"

          if [ ! -f "${{ env.PUBLISH_DIRECTORY }}/RMS.API.dll" ]; then
            echo "ERROR: RMS.API.dll was not found in publish output."
            exit 1
          fi

          if [ ! -f "${{ env.PUBLISH_DIRECTORY }}/RMS.API.runtimeconfig.json" ]; then
            echo "ERROR: RMS.API.runtimeconfig.json was not found."
            exit 1
          fi

          echo "RMS API publish output is valid."

      # 8. Đưa output publish sang job deploy
      - name: Upload RMS API artifact
        uses: actions/upload-artifact@v4
        with:
          name: rms-api
          path: ${{ env.PUBLISH_DIRECTORY }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy RMS API
    runs-on: ubuntu-latest
    needs: build

    # Bắt buộc để GitHub cấp OIDC token cho azure/login
    permissions:
      id-token: write
      contents: read

    steps:
      # 1. Tải artifact được tạo từ job build
      - name: Download RMS API artifact
        uses: actions/download-artifact@v4
        with:
          name: rms-api
          path: ./publish

      # 2. Kiểm tra lại artifact trước khi deploy
      - name: Verify downloaded artifact
        shell: bash
        run: |
          echo "Downloaded files:"
          ls -la ./publish

          if [ ! -f "./publish/RMS.API.dll" ]; then
            echo "ERROR: RMS.API.dll was not found in downloaded artifact."
            exit 1
          fi

          if [ ! -f "./publish/RMS.API.runtimeconfig.json" ]; then
            echo "ERROR: RMS.API.runtimeconfig.json was not found."
            exit 1
          fi

          echo "Downloaded artifact is valid."

      # 3. Đăng nhập Azure bằng Managed Identity + OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Deploy đúng thư mục publish lên Azure App Service
      - name: Deploy to Azure App Service
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./publish
