name: Build and deploy RMS API to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  API_PROJECT: "backend/src/RMS.API/RMS.API.csproj"
  PUBLISH_DIRECTORY: "./publish"
  AZURE_WEBAPP_NAME: "rms-api-hientm-2026"

jobs:
  build:
    name: Build RMS API
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Display .NET information
        run: dotnet --info

      - name: Restore RMS API
        run: dotnet restore "${{ env.API_PROJECT }}"

      - name: Publish RMS API
        run: >
          dotnet publish
          "${{ env.API_PROJECT }}"
          --configuration Release
          --output "${{ env.PUBLISH_DIRECTORY }}"
          --no-restore

      - name: Verify publish output
        run: |
          echo "Published files:"
          ls -la "${{ env.PUBLISH_DIRECTORY }}"

          if [ ! -f "${{ env.PUBLISH_DIRECTORY }}/RMS.API.dll" ]; then
            echo "RMS.API.dll was not found in publish output."
            exit 1
          fi

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: rms-api
          path: ${{ env.PUBLISH_DIRECTORY }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy RMS API
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: rms-api
          path: ./publish

      - name: Verify downloaded artifact
        run: |
          echo "Downloaded files:"
          ls -la ./publish

          if [ ! -f "./publish/RMS.API.dll" ]; then
            echo "RMS.API.dll was not found in downloaded artifact."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_87E641B5A5EE46C3829056C3414AB7C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_81F1F3DDABAC452CA434B133D194E8C4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F6A36A15D92C47069BEF7D7F8B05085E }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./publish
