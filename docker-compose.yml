version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rms-sqlserver
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "RMS@Strong!Pass123"
      ACCEPT_EULA: "Y"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
