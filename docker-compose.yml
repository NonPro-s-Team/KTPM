services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: rms-sqlserver
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - rms-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" ||
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  rms-sqlserver-data:
    name: rms-sqlserver-data
